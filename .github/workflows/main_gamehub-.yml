name: Build and deploy ASP.Net Core app to Azure Web App - gamehub-

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build GameHubApi/GameHubApi/GameHubApi.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish GameHubApi/GameHubApi/GameHubApi.csproj -c Release -o publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_89B31F3D6344431E9667306620033979 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C86E073B3AE44E418C40EB42A521893F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E24DC786AD744E248D8085A98D2992DF }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gamehub-'
          slot-name: 'Production'
          package: .
