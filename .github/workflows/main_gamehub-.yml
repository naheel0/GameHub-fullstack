name: Build and deploy ASP.Net Core app to Azure Web App - gamehub-

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build GameHubApi/GameHubApi/GameHubApi.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish GameHubApi/GameHubApi/GameHubApi.csproj -c Release -o publish

      - name: Archive publish output
        run: Compress-Archive -Path publish\* -DestinationPath publish.zip

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish.zip

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_89B31F3D6344431E9667306620033979 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C86E073B3AE44E418C40EB42A521893F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E24DC786AD744E248D8085A98D2992DF }}

      - name: Deploy to Azure Web App
        shell: pwsh
        run: |
          $rg = az webapp list --query "[?name=='gamehub-'].resourceGroup | [0]" -o tsv
          if (-not $rg) { throw "Web app 'gamehub-' not found in subscription" }
          Write-Host "Deploying to resource group: $rg"
          az webapp deployment source config-zip --resource-group $rg --name gamehub- --src ./publish.zip
